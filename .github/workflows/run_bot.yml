name: Telegram Bot Loop

on:
  workflow_dispatch: # Просто кнопка «Запустить» в панели

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: Проверка кода
      uses: actions/checkout@v3

    - name: Установка Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Установка Telethon
      run: pip install telethon

    - name: Запуск скрипта
      run: python api/bot.py
