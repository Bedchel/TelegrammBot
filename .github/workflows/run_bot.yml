name: Telegram Bot Loop

on:
  workflow_dispatch: # Запуск кнопкой вручную в панели Actions

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: Проверка кода
      uses: actions/checkout@v3

    - name: Установка Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Установка Telethon
      run: pip install telethon

    - name: Запуск скрипта с автопоиском
      run: python $(find . -name "bot.py" -o -name "bot.py.txt" | head -n 1)
