name: Telegram Bot Loop With Auto-Restart

on:
  workflow_dispatch: # Запуск кнопкой вручную
  repository_dispatch:
    types: [restart_bot] # Принимает сигнал автоперезапуска от самого себя

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: Проверка кода
      uses: actions/checkout@v3

    - name: Установка Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Установка библиотек
      run: pip install telethon requests

    - name: Создание файла bot.py на сервере
      run: |
        cat << 'EOF' > bot.py
        import asyncio
        import requests
        import os
        from telethon import TelegramClient

        api_id = 37587197
        api_hash = 'ebe579cce7e826af00b4771f6837908d'

        CHATS = ['@deltarune_cases_bot']
        COMMAND = "/open DELTARUNE"

        # strip() уберет все случайно попавшие пробелы и переносы строк
        GITHUB_TOKEN = os.getenv("MY_GITHUB_TOKEN", "").strip()
        REPO = os.getenv("GITHUB_REPOSITORY", "").strip()

        def restart_workflow():
            print("5 часов прошло. Отправляем запрос на перезапуск...")
            url = f"https://api.github.com/repos/{REPO}/dispatches"
            
            # Используем Bearer вместо token — это современный стандарт GitHub API
            headers = {
                "Authorization": f"Bearer {GITHUB_TOKEN}",
                "Accept": "application/vnd.github.v3+json"
            }
            data = {"event_type": "restart_bot"}
            
            response = requests.post(url, headers=headers, json=data)
            if response.status_code == 204:
                print("Новая копия успешно запущена!")
            else:
                print(f"Не удалось перезапустить: {response.status_code}, {response.text}")

        async def main():
            async with TelegramClient('my_session', api_id, api_hash) as client:
                for circle in range(10): 
                    print(f"Запуск круга отправки {circle + 1}/10...")
                    for chat in CHATS:
                        try:
                            await client.send_message(chat, COMMAND)
                            print(f"Сообщение успешно отправлено в {chat}")
                            await asyncio.sleep(3)
                        except Exception as e:
                            print(f"Не удалось отправить в {chat}: {e}")
                    
                    print("Круг завершен. Засыпаем на 30 минут...")
                    await asyncio.sleep(1800)
                
                restart_workflow()

        if __name__ == '__main__':
            asyncio.run(main())
        EOF

    - name: Запуск скрипта
      env:
        MY_GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
      run: python bot.py
